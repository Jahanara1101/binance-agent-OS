[project]
name = "binance-agent-market-maker"
version = "0.1.0"
description = "Binance USD-M perpetual liquidity agent with paper, demo, and live modes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "rich>=13.7,<15",

]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
binance-mm = "binance_mm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/binance_mm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
exclude = ["hermes-plugin"]
